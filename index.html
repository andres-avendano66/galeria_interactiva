<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Fotográfica Interactiva</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Galería Fotográfica</h1>

    <!-- Este es el contenedor que va a cambiar -->
    <div id="image">
        Pase el ratón por encima de una imagen para mostrarla aquí
    </div>

    <!-- Contenedor de las miniaturas -->
    <div class="galeria">
        <img class="preview" alt="Paisaje montañoso al amanecer"
            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"
            onmouseover="upDate(this)" onmouseout="unDo()">

        <img class="preview" alt="Lago cristalino en el bosque"
            src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"
            onmouseover="upDate(this)" onmouseout="unDo()">

        <img class="preview" alt="Cielo estrellado sobre la nieve"
            src="https://images.unsplash.com/photo-1472396961693-142e6e269027?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"
            onmouseover="upDate(this)" onmouseout="unDo()">
    </div>

    <!-- Enlace al archivo JavaScript al final del body -->
    <script src="script.js"></script>
</body>

</html>
